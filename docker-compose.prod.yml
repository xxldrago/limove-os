# Production overlay: build is baked into the image (see Dockerfile),
# so startup is only migrate + start — seconds of downtime, not minutes.
# Usage on server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  app:
    command: >
      sh -c "npx prisma db push &&
             npm start"
    volumes: !reset
      - uploads_data:/app/uploads
